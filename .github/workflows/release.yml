# Builds the release from a tag on a clean runner, records where the executable came from
# (a signed build provenance attestation), and publishes it as a GitHub release.
#
# - Pushing a tag like v1.2.3 runs it.
# - It can also be run by hand for a tag already pushed (Actions > Release > Run workflow).
#
# The release notes are the tagged commit's message without its first line (the squash commit
# on main), followed by the executable's SHA-256 and how to verify it.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release, like v0.2.0"
        required: true

permissions:
  contents: write # create the release and upload the executable
  id-token: write # sign the attestation
  attestations: write # store the attestation

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Windows runners turn LF into CRLF on checkout. Build from the bytes as committed, so
      # the texts built into the executable (the licenses) are the ones in the repository.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Check the version matches the tag
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1 | tr -d '\r')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Cargo.toml says $version, but the tag is $TAG"
            exit 1
          fi

      # With no argument, rustup installs the compiler rust-toolchain.toml names.
      - name: Install the toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/release/LightTaskManager.exe

      - name: Write the release notes
        shell: bash
        run: |
          sha=$(sha256sum target/release/LightTaskManager.exe | cut -d' ' -f1)
          {
            git log -1 --format=%B HEAD | tail -n +2 | grep -v '^Co-Authored-By:' | sed -e '/./,$!d'
            echo
            echo "## Verifying the download"
            echo
            echo "SHA-256 of \`LightTaskManager.exe\`: \`$sha\`"
            echo
            echo "It was built by GitHub Actions from the tagged commit. To check that a downloaded copy is that build:"
            echo
            echo '```'
            echo "gh attestation verify LightTaskManager.exe --repo $GITHUB_REPOSITORY"
            echo '```'
          } > notes.md
          cat notes.md

      - name: Publish the release
        shell: bash
        run: |
          # Never replace the executable of a published release: its notes carry the old hash.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::The release $TAG already exists. Delete it first to publish it again."
            exit 1
          fi
          gh release create "$TAG" target/release/LightTaskManager.exe --verify-tag --title "$TAG" --notes-file notes.md
